name: 框架缺陷
description: 构建失败、布局/渲染异常、部署问题等
labels: ['bug', 'framework']
title: 'fix: '
body:
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 构建与 CI
        - 开发 / 预览
        - 生产部署
        - Markdown / MDX 渲染
        - 布局 / 组件 / 样式
        - 搜索 / OG / RSS
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        分支或 commit：……
        pnpm dev / build：……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      render: shell
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Node / pnpm / OS / 浏览器
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前
      options:
        - label: 已在目标分支上复现
          required: true
        - label: 已排除单篇 content 笔误；若相关请注明文件路径
          required: true
